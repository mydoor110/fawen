<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>连接测试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .test-item {
            margin: 20px 0;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .test-item h3 {
            margin: 0 0 10px 0;
        }
        .result {
            margin-top: 10px;
            padding: 10px;
            border-radius: 3px;
        }
        .success {
            background: #d4edda;
            color: white;
            padding: 10px;
        }
        .error {
            background: #f8d7da;
            color: white;
            padding: 10px;
        }
        .loading {
            color: blue;
        padding: 10px;
        }
        .log {
            background: #f5f5f5;
            padding: 10px;
            margin-top: 10px;
            font-family: monospace;
            font-size: 12px;
            max-height: 200px;
            overflow: auto;
        }
        button {
            margin: 10px 5px;
            padding: 10px 20px;
            cursor: pointer;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <h1>公文文件号管理系统 - 连接诊断</h1>
    
    <div class="test-item">
        <h3>1. 测试后端健康检查</h3>
        <button onclick="test1()">测试</button>
        <div id="result1" class="result">等待测试...</div>
    </div>
    
    <div class="test-item">
        <h3>2. 测试登录接口</h3>
        <button onclick="test2()">测试</button>
        <div id="result2" class="result">等待测试...</div>
    </div>
    
    <div class="test-item">
        <h3>3. 测试获取当前用户</h3>
        <button onclick="test3()">测试</button>
        <div id="result3" class="result">等待测试...</div>
    </div>
    
    <div class="test-item">
        <h3>4. 检查localStorage</h3>
        <button onclick="test4()">测试</button>
        <div id="result4" class="result">等待测试...</div>
    </div>
    
    <div class="log" id="log"></div>
    
    <script>
        const API_BASE = 'http://192.168.1.99:5173/api';
        
        function log(message) {
            const logDiv = document.getElementById('log');
            logDiv.innerHTML = '[ ' + new Date().toLocaleTimeString() + '] ' + message + '<br>' + logDiv.innerHTML;
            logDiv.scrollTop = logDiv.scrollHeight;
        }
        
        function showResult(elementId, success, message) {
            const resultDiv = document.getElementById(elementId);
            if (success) {
                resultDiv.innerHTML = '<div class="success">✅ ' + message + '</div>';
            } else {
                resultDiv.innerHTML = '<div class="error">❌ ' + message + '</div>';
            }
        }
        
        async function test1() {
            showResult('result1', true, '正在测试...');
            try {
                log('正在请求: GET ' + API_BASE.replace('/api', '') + '/health');
                const response = await fetch(API_BASE.replace('/api', '') + '/health');
                const data = await response.json();
                
                log('响应状态: ' + response.status);
                log('响应内容: ' + JSON.stringify(data));
                
                showResult('result1', true, '连接成功！状态: ' + data.status);
            } catch (error) {
                log('错误: ' + error.message);
                showResult('result1', false, '连接失败: ' + error.message);
            }
        }
        
        async function test2() {
            showResult('result2', true, '正在测试...');
            try {
                log('正在请求: POST ' + API_BASE + '/auth/login');
                
                const formData = new URLSearchParams();
                formData.append('username', 'admin');
                formData.append('password', 'admin123');
                
                const response = await fetch(API_BASE + '/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: formData
                });
                
                log('响应状态: ' + response.status);
                
                const data = await response.json();
                log('响应内容: ' + JSON.stringify(data));
                
                localStorage.setItem('test_token', data.access_token);
                
                showResult('result2', true, '登录成功！Token: ' + data.access_token.substring(0, 30) + '...');
            } catch (error) {
                log('错误: ' + error.message);
                showResult('result2', false, '登录失败: ' + error.message);
            }
        }
        
        async function test3() {
            const token = localStorage.getItem('test_token');
            if (!token) {
                showResult('result3', false, '未找到Token，请先测试登录');
                return;
            }
            
            showResult('result3', true, '正在测试...');
            try {
                log('正在请求: GET ' + API_BASE + '/auth/me');
                const response = await fetch(API_BASE + '/auth/me', {
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    }
                });
                
                log('响应状态: ' + response.status);
                
                const data = await response.json();
                log('响应内容: ' + JSON.stringify(data));
                
                showResult('result3', true, '获取用户信息成功！用户: ' + data.username);
            } catch (error) {
                log('错误: ' error.message);
                showResult('result3', false, '获取失败: ' + error.message);
            }
        }
        
        function test4() {
            const token = localStorage.getItem('test_token');
            const userStr = localStorage.getItem('user_info');
            
            let html = '<strong>测试项目：</strong><br>';
            html += 'Token: ' + (token ? token.substring(0, 30) + '...' : '不存在') + '<br>';
            html += '用户信息: ' + (userStr ? userStr : '不存在') + '<br>';
            
            showResult('result4', true, html);
            
            log('Token长度: ' + (token ? token.length : 0));
            log('用户信息: ' + userStr);
        }
    </script>
</body>
</html>
